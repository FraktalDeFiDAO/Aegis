# DOM XSS Pattern Database
# This file contains a comprehensive list of patterns for detecting DOM-based XSS vulnerabilities
# "Kitchen Sink" edition - extremely aggressive detection

version: "2.0"
last_updated: "2026-02-04"

# Sources: Entry points where user-controlled data can enter the application
sources:
  # --- Navigation / URL ---
  - name: "location.hash"
    pattern: 'location\.hash'
    description: "URL fragment identifier - highly dangerous if used in sinks"
    severity: "INFO"
    category: "url"

  - name: "location.search"
    pattern: 'location\.search'
    description: "URL query string"
    severity: "INFO"
    category: "url"

  - name: "location.href"
    pattern: 'location\.href'
    description: "Full URL"
    severity: "INFO"
    category: "url"

  - name: "location.pathname"
    pattern: 'location\.pathname'
    description: "URL path component"
    severity: "INFO"
    category: "url"

  - name: "document.URL"
    pattern: 'document\.URL'
    description: "Document URL property"
    severity: "INFO"
    category: "url"

  - name: "document.documentURI"
    pattern: 'document\.documentURI'
    description: "Document URI property"
    severity: "INFO"
    category: "url"

  - name: "document.baseURI"
    pattern: 'document\.baseURI'
    description: "Base URI of the document"
    severity: "INFO"
    category: "url"

  - name: "document.referrer"
    pattern: 'document\.referrer'
    description: "Referring page URL - attacker controlled"
    severity: "INFO"
    category: "url"

  # --- Storage ---
  - name: "localStorage.getItem"
    pattern: 'localStorage\.getItem\s*\('
    description: "Local storage read"
    severity: "INFO"
    category: "storage"

  - name: "sessionStorage.getItem"
    pattern: 'sessionStorage\.getItem\s*\('
    description: "Session storage read"
    severity: "INFO"
    category: "storage"

  - name: "localStorage[]"
    pattern: 'localStorage\s*\['
    description: "Local storage bracket access"
    severity: "INFO"
    category: "storage"

  - name: "sessionStorage[]"
    pattern: 'sessionStorage\s*\['
    description: "Session storage bracket access"
    severity: "INFO"
    category: "storage"

  - name: "document.cookie"
    pattern: 'document\.cookie'
    description: "Document cookies"
    severity: "INFO"
    category: "cookie"

  # --- Window / Frames ---
  - name: "window.name"
    pattern: 'window\.name'
    description: "Window name - persistent cross-domain storage"
    severity: "INFO"
    category: "window"

  - name: "window.location"
    pattern: 'window\.location'
    description: "Window location object"
    severity: "INFO"
    category: "url"
    
  - name: "opener.location"
    pattern: 'opener\.location'
    description: "Parent window location"
    severity: "INFO"
    category: "window"
    
  - name: "parent.location"
    pattern: 'parent\.location'
    description: "Parent frame location"
    severity: "INFO"
    category: "window"

  # --- Message / Events ---
  - name: "postMessage.data"
    pattern: '\.data'
    description: "postMessage payload"
    severity: "INFO"
    category: "message"

  - name: "event.data"
    pattern: 'event\.data'
    description: "Generic event data"
    severity: "INFO"
    category: "message"

  - name: "e.data"
    pattern: '\be\.data\b'
    description: "Event data shorthand"
    severity: "INFO"
    category: "message"

  # --- Forms / Input ---
  - name: "input.value"
    pattern: '\.value'
    description: "Form input value"
    severity: "INFO"
    category: "form"

  - name: "document.forms"
    pattern: 'document\.forms'
    description: "Forms collection"
    severity: "INFO"
    category: "form"

  # --- Modern APIs ---
  - name: "URLSearchParams"
    pattern: 'URLSearchParams\s*\('
    description: "URL Search Params API"
    severity: "INFO"
    category: "url"

  - name: "new URL"
    pattern: 'new\s+URL\s*\('
    description: "URL API"
    severity: "INFO"
    category: "url"

  # --- Database ---
  - name: "indexedDB"
    pattern: 'indexedDB'
    description: "IndexedDB access"
    severity: "INFO"
    category: "storage"
    
  - name: "openDatabase"
    pattern: 'openDatabase'
    description: "WebSQL access"
    severity: "INFO"
    category: "storage"

  # --- jQuery Sources ---
  - name: "$.param"
    pattern: '\$\.param\s*\('
    description: "jQuery param serialization"
    severity: "INFO"
    category: "jquery"

  - name: ".val()"
    pattern: '\.val\s*\(\s*\)'
    description: "jQuery value getter"
    severity: "INFO"
    category: "jquery"

  - name: ".data()"
    pattern: '\.data\s*\(\s*[''"]'
    description: "jQuery data getter"
    severity: "INFO"
    category: "jquery"

  - name: ".attr()"
    pattern: '\.attr\s*\(\s*[''"]'
    description: "jQuery attribute getter"
    severity: "INFO"
    category: "jquery"

  # --- Common Custom Getters ---
  - name: "getParameter"
    pattern: 'getParameter\s*\('
    description: "Custom parameter getter"
    severity: "INFO"
    category: "custom"

  - name: "getParam"
    pattern: 'getParam\s*\('
    description: "Custom param getter"
    severity: "INFO"
    category: "custom"

  - name: "getQuery"
    pattern: 'getQuery\s*\('
    description: "Custom query getter"
    severity: "INFO"
    category: "custom"

  - name: "getUrlParam"
    pattern: 'getUrlParam\s*\('
    description: "Custom URL param getter"
    severity: "INFO"
    category: "custom"

# Sinks: Dangerous functions that can execute code or inject HTML
sinks:
  # --- Script Execution (Code Injection) ---
  - name: "eval"
    pattern: '\beval\s*\('
    description: "Direct code execution"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "Function"
    pattern: '\bFunction\s*\('
    description: "Function constructor code execution"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "new Function"
    pattern: '\bnew\s+Function\s*\('
    description: "New Function constructor"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setTimeout-string"
    pattern: 'setTimeout\s*\(\s*[''"`]'
    description: "setTimeout with string code"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setInterval-string"
    pattern: 'setInterval\s*\(\s*[''"`]'
    description: "setInterval with string code"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setImmediate-string"
    pattern: 'setImmediate\s*\(\s*[''"`]'
    description: "setImmediate with string code"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "execScript"
    pattern: 'execScript\s*\('
    description: "IE execScript"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "crypto.generateCRMFRequest"
    pattern: 'crypto\.generateCRMFRequest\s*\('
    description: "Firefox crypto vulnerability"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  # --- HTML Injection (XSS) ---
  - name: "innerHTML="
    pattern: '\.innerHTML\s*='
    description: "Classic DOM XSS sink"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "outerHTML="
    pattern: '\.outerHTML\s*='
    description: "DOM XSS sink"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.write"
    pattern: 'document\.write\s*\('
    description: "Document write DOM XSS"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.writeln"
    pattern: 'document\.writeln\s*\('
    description: "Document writeln DOM XSS"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "insertAdjacentHTML"
    pattern: '\.insertAdjacentHTML\s*\('
    description: "Insert adjacent HTML"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  # --- DOM Modification Sinks ---
  - name: "createContextualFragment"
    pattern: 'createContextualFragment\s*\('
    description: "Range.createContextualFragment"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "createElement-script"
    pattern: 'createElement\s*\(\s*[''"]script[''"]'
    description: "Dynamic script creation"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "script.src="
    pattern: 'script\.src\s*='
    description: "Setting script source"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "script.text="
    pattern: 'script\.text\s*='
    description: "Setting script content"
    severity: "CRITICAL"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "script.textContent="
    pattern: 'script\.textContent\s*='
    description: "Setting script text content"
    severity: "CRITICAL"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "script.innerText="
    pattern: 'script\.innerText\s*='
    description: "Setting script inner text"
    severity: "CRITICAL"
    cwe: "CWE-79"
    category: "dom-manipulation"
    
  - name: "iframe.srcdoc="
    pattern: '\.srcdoc\s*='
    description: "Iframe srcdoc injection"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  # --- Dangerous Attribute Sinks ---
  - name: "setAttribute-on*"
    pattern: 'setAttribute\s*\(\s*[''"]on'
    description: "Setting event handler attribute"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "attributes"

  - name: "setAttribute-src"
    pattern: 'setAttribute\s*\(\s*[''"]src[''"]'
    description: "Setting src attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attributes"

  - name: "setAttribute-href"
    pattern: 'setAttribute\s*\(\s*[''"]href[''"]'
    description: "Setting href attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attributes"
    
  - name: "form.action="
    pattern: 'form\.action\s*='
    description: "Form action hijacking"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "attributes"
    
  - name: "input.formAction="
    pattern: '\.formAction\s*='
    description: "Input formAction hijacking"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "attributes"

  # --- Navigation / Redirect Sinks ---
  - name: "location="
    pattern: '\blocation\s*='
    description: "Open redirect / JavaScript URI"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.href="
    pattern: 'location\.href\s*='
    description: "Open redirect / JavaScript URI"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.assign"
    pattern: 'location\.assign\s*\('
    description: "Open redirect"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.replace"
    pattern: 'location\.replace\s*\('
    description: "Open redirect"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "window.open"
    pattern: 'window\.open\s*\('
    description: "Window open / tabnabbing"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  # --- jQuery Sinks ---
  - name: "$.html()"
    pattern: '\.html\s*\([^)]+\)'
    description: "jQuery HTML injection"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.append()"
    pattern: '\.append\s*\([^)]+\)'
    description: "jQuery append injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.prepend()"
    pattern: '\.prepend\s*\([^)]+\)'
    description: "jQuery prepend injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.after()"
    pattern: '\.after\s*\([^)]+\)'
    description: "jQuery after injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.before()"
    pattern: '\.before\s*\([^)]+\)'
    description: "jQuery before injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.replaceWith()"
    pattern: '\.replaceWith\s*\([^)]+\)'
    description: "jQuery replaceWith injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.wrap()"
    pattern: '\.wrap\s*\([^)]+\)'
    description: "jQuery wrap injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.wrapAll()"
    pattern: '\.wrapAll\s*\([^)]+\)'
    description: "jQuery wrapAll injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"
    
  - name: "$.wrapInner()"
    pattern: '\.wrapInner\s*\([^)]+\)'
    description: "jQuery wrapInner injection"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.globalEval()"
    pattern: '\$\.globalEval\s*\('
    description: "jQuery global code execution"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    
  - name: "$.parseHTML()"
    pattern: '\$\.parseHTML\s*\('
    description: "jQuery parseHTML - check if scripts allowed"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  # --- Framework Specific Sinks ---
  - name: "v-html"
    pattern: 'v-html\s*='
    description: "Vue v-html XSS"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "vue"

  - name: "dangerouslySetInnerHTML"
    pattern: 'dangerouslySetInnerHTML'
    description: "React XSS sink"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "react"

  - name: "[innerHTML]"
    pattern: '\[innerHTML\]\s*='
    description: "Angular innerHTML binding"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "angular"

  - name: "ng-bind-html"
    pattern: 'ng-bind-html\s*='
    description: "AngularJS binding"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "angular"
    
  - name: "bypassSecurityTrust"
    pattern: 'bypassSecurityTrust'
    description: "Angular security bypass"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "angular"

  - name: "trustAsHtml"
    pattern: 'trustAsHtml\s*\('
    description: "AngularJS trustAsHtml"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "angular"
    
  - name: "m.trust"
    pattern: 'm\.trust\s*\('
    description: "Mithril trustAsHtml"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "mithril"
    
  - name: "Ractive.unescaped"
    pattern: 'Ractive\.unescaped'
    description: "Ractive unescaped content"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "ractive"

# Framework detection patterns
frameworks:
  - name: "jQuery"
    pattern: 'jquery|\.fn\.|jQuery|\$\s*\('
    version_pattern: 'jquery[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "React"
    pattern: 'React\.|ReactDOM|createElement|useState|useEffect|dangerouslySetInnerHTML'
    version_pattern: 'react[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Vue"
    pattern: 'Vue\.|v-bind|v-model|v-html|v-on:|@click|:class'
    version_pattern: 'vue[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Angular"
    pattern: 'angular\.|ng-|ngIf|ngFor|\[ngClass\]'
    version_pattern: 'angular[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "AngularJS"
    pattern: 'angular\.module|ng-app|ng-controller'
    version_pattern: 'angular[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Svelte"
    pattern: '<script.*context="module"|{@html|bind:'
    version_pattern: 'svelte[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Ember"
    pattern: 'Ember\.|Marionette|{{#each|{{#if'
    version_pattern: 'ember[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Backbone"
    pattern: 'Backbone\.|Marionette'
    version_pattern: 'backbone[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Handlebars"
    pattern: 'Handlebars\.|{{#|{{/|{{>'
    version_pattern: 'handlebars[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Lodash"
    pattern: '_\.|lodash'
    version_pattern: 'lodash[/-]?(\d+\.\d+(?:\.\d+)?)'
    
  - name: "Mithril"
    pattern: 'm\.render|m\.mount|m\.route'
    version_pattern: 'mithril[/-]?(\d+\.\d+(?:\.\d+)?)'
    
  - name: "Knockout"
    pattern: 'ko\.observable|data-bind='
    version_pattern: 'knockout[/-]?(\d+\.\d+(?:\.\d+)?)'

# XSS Payloads for active testing
payloads:
  basic:
    - '<script>alert(1)</script>'
    - '<img src=x onerror=alert(1)>'
    - '<svg onload=alert(1)>'
    - '<body onload=alert(1)>'
    - '<iframe src="javascript:alert(1)">'
    - '<input onfocus=alert(1) autofocus>'
    - '<marquee onstart=alert(1)>'
    - '<video><source onerror=alert(1)>'
    - '<audio src=x onerror=alert(1)>'
    - '<details open ontoggle=alert(1)>'
    - '<isindex type=image src=1 onerror=alert(1)>'
    - '<keygen autofocus onfocus=alert(1)>'
    - '<textarea autofocus onfocus=alert(1)>'
    - '<style>@keyframes x{}</style><xss style="animation-name:x" onanimationstart="alert(1)"></xss>'

  event_handlers:
    - "'-alert(1)-'"
    - '"-alert(1)-"'
    - "';alert(1)//"
    - '";alert(1)//'
    - "onmouseover=alert(1)//"
    - "onfocus=alert(1) autofocus//"
    - "onclick=alert(1)//"
    - "onmouseenter=alert(1)//"
    - "onmouseleave=alert(1)//"
    - "onpointerenter=alert(1)//"
    - "onpointerover=alert(1)//"

  javascript_protocol:
    - 'javascript:alert(1)'
    - 'javascript:alert(document.domain)'
    - 'javascript:alert(document.cookie)'
    - 'JaVaScRiPt:alert(1)'
    - 'javascript:/**/alert(1)'
    - 'vbscript:alert(1)'
    - 'data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg=='

  encoded:
    - '%3Cscript%3Ealert(1)%3C/script%3E'
    - '%3Csvg%20onload=alert(1)%3E'
    - '&#60;script&#62;alert(1)&#60;/script&#62;'
    - '\x3cscript\x3ealert(1)\x3c/script\x3e'
    - '\u003cscript\u003ealert(1)\u003c/script\u003e'
    - '&lt;script&gt;alert(1)&lt;/script&gt;'

  template_injection:
    - '{{constructor.constructor("alert(1)")()}}'
    - '${alert(1)}'
    - '#{alert(1)}'
    - '{{7*7}}'
    - '${7*7}'
    - '{{=alert(1)}}'
    - '{{$eval(alert(1))}}'

  dom_clobbering:
    - '<form id=x><input name=y value=z>'
    - '<img name=x>'
    - '<a id=x href=y>'
    - '<a id=x href=y name=z>'
    - '<form name=x id=x>'

  filter_bypass:
    - '<svg/onload=alert(1)>'
    - '<svg onload=alert(1)//>'
    - '<svg onload="alert(1)">'
    - "<svg onload='alert(1)'>"
    - '<img src=x onerror="alert(1)">'
    - '<img src=x onerror=alert`1`>'
    - '<script>alert(String.fromCharCode(88,83,83))</script>'
    - '<svg><animate onbegin=alert(1) attributeName=x dur=1s>'

  polyglot:
    - "jaVasCript:/*-/*`/*\\`/*'/*\"/**/(/* */oNcLiCk=alert() )//"
    - "'\"-->]]>*/</script></style></title></textarea></noscript></template></select><svg/onload=alert()>"
    - "javascript://%250Aalert(1)//"
    - "/*-->\"></title></style></textarea></script><xmp><svg/onload='+/'/+/onmouseover=1/+/[*/[]/+alert(1)//'>"