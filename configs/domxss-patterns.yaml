# ============================================================================
# DOM XSS Pattern Database v2.0 - COMPREHENSIVE EDITION
# ============================================================================
# This file contains exhaustive patterns for detecting DOM-based XSS
# vulnerabilities through static analysis of JavaScript/HTML code.
#
# Pattern Categories:
# - Sources: Entry points where attacker-controlled data enters the application
# - Sinks: Dangerous functions that can execute code or inject content
# - Sanitizers: Functions that may neutralize XSS payloads
# - Frameworks: Detection patterns for JavaScript frameworks
# - Payloads: Test vectors for active scanning
#
# Severity Levels:
# - CRITICAL: Direct code execution (eval, Function)
# - HIGH: HTML injection (innerHTML, document.write)
# - MEDIUM: Potential injection depending on context
# - LOW: Requires specific conditions to exploit
# - INFO: Informational, may indicate attack surface
#
# Last Updated: 2026-02-04
# ============================================================================

version: "2.0"
last_updated: "2026-02-04"
maintainer: "security-team"

# ============================================================================
# SOURCES - Where user-controlled data enters the application
# ============================================================================
sources:

  # ---------------------------------------------------------------------------
  # URL-Based Sources (Most Common Attack Vector)
  # ---------------------------------------------------------------------------
  - name: "location.hash"
    pattern: 'location\.hash'
    description: "URL fragment identifier (#) - bypasses server-side logging"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"
    notes: "Fragment is never sent to server, purely client-side"

  - name: "location.search"
    pattern: 'location\.search'
    description: "URL query string (?key=value)"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"

  - name: "location.href"
    pattern: 'location\.href(?!\s*=)'
    description: "Full URL including all components"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"

  - name: "location.pathname"
    pattern: 'location\.pathname'
    description: "URL path component"
    severity: "INFO"
    category: "url"
    exploitability: "MEDIUM"

  - name: "location.host"
    pattern: 'location\.host(?:name)?'
    description: "URL hostname (rarely exploitable)"
    severity: "INFO"
    category: "url"
    exploitability: "LOW"

  - name: "location.origin"
    pattern: 'location\.origin'
    description: "URL origin (protocol + host)"
    severity: "INFO"
    category: "url"
    exploitability: "LOW"

  - name: "location.protocol"
    pattern: 'location\.protocol'
    description: "URL protocol (http:, https:, javascript:)"
    severity: "INFO"
    category: "url"
    exploitability: "LOW"

  - name: "location.port"
    pattern: 'location\.port'
    description: "URL port number"
    severity: "INFO"
    category: "url"
    exploitability: "LOW"

  - name: "document.URL"
    pattern: 'document\.URL'
    description: "Document URL property"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"

  - name: "document.documentURI"
    pattern: 'document\.documentURI'
    description: "Document URI property"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"

  - name: "document.baseURI"
    pattern: 'document\.baseURI'
    description: "Base URI of the document"
    severity: "INFO"
    category: "url"
    exploitability: "MEDIUM"

  - name: "document.referrer"
    pattern: 'document\.referrer'
    description: "Referring page URL - can be attacker-controlled"
    severity: "INFO"
    category: "url"
    exploitability: "HIGH"

  - name: "document.domain"
    pattern: 'document\.domain(?!\s*=)'
    description: "Document domain property"
    severity: "INFO"
    category: "url"
    exploitability: "LOW"

  # ---------------------------------------------------------------------------
  # URL Parsing APIs
  # ---------------------------------------------------------------------------
  - name: "URLSearchParams"
    pattern: 'new\s+URLSearchParams\s*\('
    description: "Modern URL parameter parsing API"
    severity: "INFO"
    category: "url-api"
    exploitability: "HIGH"

  - name: "URLSearchParams.get"
    pattern: '\.searchParams\.get\s*\('
    description: "Get specific URL parameter"
    severity: "INFO"
    category: "url-api"
    exploitability: "HIGH"

  - name: "URLSearchParams.getAll"
    pattern: '\.searchParams\.getAll\s*\('
    description: "Get all values for URL parameter"
    severity: "INFO"
    category: "url-api"
    exploitability: "HIGH"

  - name: "URL constructor"
    pattern: 'new\s+URL\s*\([^)]*location'
    description: "URL object created from location"
    severity: "INFO"
    category: "url-api"
    exploitability: "HIGH"

  - name: "URL.href"
    pattern: '\.href(?=\s*[;,\)])'
    description: "URL href property access"
    severity: "INFO"
    category: "url-api"
    exploitability: "MEDIUM"

  # ---------------------------------------------------------------------------
  # Cookie Sources
  # ---------------------------------------------------------------------------
  - name: "document.cookie"
    pattern: 'document\.cookie'
    description: "Document cookies - can be set via Set-Cookie or JS"
    severity: "INFO"
    category: "cookie"
    exploitability: "MEDIUM"
    notes: "Requires ability to set cookies (CRLF injection, subdomain)"

  # ---------------------------------------------------------------------------
  # Window Sources
  # ---------------------------------------------------------------------------
  - name: "window.name"
    pattern: 'window\.name'
    description: "Window name - persists across navigations, attacker-controllable"
    severity: "INFO"
    category: "window"
    exploitability: "HIGH"
    notes: "Classic XSS vector - set via window.open or link target"

  - name: "window.location"
    pattern: 'window\.location(?!\s*=)'
    description: "Window location object"
    severity: "INFO"
    category: "window"
    exploitability: "HIGH"

  - name: "self.location"
    pattern: 'self\.location'
    description: "Self location reference"
    severity: "INFO"
    category: "window"
    exploitability: "HIGH"

  - name: "top.location"
    pattern: 'top\.location'
    description: "Top frame location"
    severity: "INFO"
    category: "window"
    exploitability: "MEDIUM"

  - name: "parent.location"
    pattern: 'parent\.location'
    description: "Parent frame location"
    severity: "INFO"
    category: "window"
    exploitability: "MEDIUM"

  - name: "frames[].location"
    pattern: 'frames\s*\[[^\]]*\]\.location'
    description: "Frame location access"
    severity: "INFO"
    category: "window"
    exploitability: "MEDIUM"

  # ---------------------------------------------------------------------------
  # Storage Sources
  # ---------------------------------------------------------------------------
  - name: "localStorage.getItem"
    pattern: 'localStorage\.getItem\s*\('
    description: "Local storage read"
    severity: "INFO"
    category: "storage"
    exploitability: "MEDIUM"
    notes: "Requires prior storage poisoning"

  - name: "localStorage[]"
    pattern: 'localStorage\s*\[\s*[''"`]'
    description: "Local storage bracket notation"
    severity: "INFO"
    category: "storage"
    exploitability: "MEDIUM"

  - name: "localStorage direct"
    pattern: 'localStorage\.[a-zA-Z_][a-zA-Z0-9_]*(?!\s*=)'
    description: "Local storage direct property access"
    severity: "INFO"
    category: "storage"
    exploitability: "MEDIUM"

  - name: "sessionStorage.getItem"
    pattern: 'sessionStorage\.getItem\s*\('
    description: "Session storage read"
    severity: "INFO"
    category: "storage"
    exploitability: "MEDIUM"

  - name: "sessionStorage[]"
    pattern: 'sessionStorage\s*\[\s*[''"`]'
    description: "Session storage bracket notation"
    severity: "INFO"
    category: "storage"
    exploitability: "MEDIUM"

  - name: "indexedDB"
    pattern: 'indexedDB\.'
    description: "IndexedDB access"
    severity: "INFO"
    category: "storage"
    exploitability: "LOW"

  # ---------------------------------------------------------------------------
  # Message Sources (postMessage)
  # ---------------------------------------------------------------------------
  - name: "message event data"
    pattern: 'addEventListener\s*\(\s*[''"]message[''"]'
    description: "postMessage event listener"
    severity: "INFO"
    category: "message"
    exploitability: "HIGH"
    notes: "Check for origin validation"

  - name: "event.data"
    pattern: '(?:event|e|evt|msg)\.data'
    description: "Message event data property"
    severity: "INFO"
    category: "message"
    exploitability: "HIGH"

  - name: "event.origin"
    pattern: '(?:event|e|evt|msg)\.origin'
    description: "Message event origin (should be validated)"
    severity: "INFO"
    category: "message"
    exploitability: "INFO"

  - name: "onmessage handler"
    pattern: '\.onmessage\s*='
    description: "Direct onmessage handler assignment"
    severity: "INFO"
    category: "message"
    exploitability: "HIGH"

  # ---------------------------------------------------------------------------
  # Form/Input Sources
  # ---------------------------------------------------------------------------
  - name: "input.value"
    pattern: '\.value(?=\s*[;,\)}\]])'
    description: "Input element value"
    severity: "INFO"
    category: "form"
    exploitability: "MEDIUM"

  - name: "textarea.value"
    pattern: 'textarea[^.]*\.value'
    description: "Textarea value"
    severity: "INFO"
    category: "form"
    exploitability: "MEDIUM"

  - name: "select.value"
    pattern: 'select[^.]*\.value'
    description: "Select element value"
    severity: "INFO"
    category: "form"
    exploitability: "LOW"

  - name: "document.forms"
    pattern: 'document\.forms'
    description: "Document forms collection"
    severity: "INFO"
    category: "form"
    exploitability: "MEDIUM"

  - name: "FormData"
    pattern: 'new\s+FormData\s*\('
    description: "FormData object"
    severity: "INFO"
    category: "form"
    exploitability: "MEDIUM"

  - name: "form.elements"
    pattern: '\.elements\s*\['
    description: "Form elements access"
    severity: "INFO"
    category: "form"
    exploitability: "MEDIUM"

  # ---------------------------------------------------------------------------
  # DOM Reading Sources
  # ---------------------------------------------------------------------------
  - name: "innerHTML read"
    pattern: '=\s*[^=]*\.innerHTML(?!\s*=)'
    description: "Reading innerHTML (potential DOM clobbering)"
    severity: "INFO"
    category: "dom"
    exploitability: "LOW"

  - name: "outerHTML read"
    pattern: '=\s*[^=]*\.outerHTML(?!\s*=)'
    description: "Reading outerHTML"
    severity: "INFO"
    category: "dom"
    exploitability: "LOW"

  - name: "textContent read"
    pattern: '\.textContent(?!\s*=)'
    description: "Reading textContent"
    severity: "INFO"
    category: "dom"
    exploitability: "LOW"

  - name: "innerText read"
    pattern: '\.innerText(?!\s*=)'
    description: "Reading innerText"
    severity: "INFO"
    category: "dom"
    exploitability: "LOW"

  - name: "getAttribute"
    pattern: '\.getAttribute\s*\('
    description: "Get element attribute"
    severity: "INFO"
    category: "dom"
    exploitability: "MEDIUM"

  - name: "dataset"
    pattern: '\.dataset\.'
    description: "Data attribute access"
    severity: "INFO"
    category: "dom"
    exploitability: "MEDIUM"

  - name: "attributes[]"
    pattern: '\.attributes\s*\['
    description: "Attributes collection access"
    severity: "INFO"
    category: "dom"
    exploitability: "LOW"

  # ---------------------------------------------------------------------------
  # jQuery Sources
  # ---------------------------------------------------------------------------
  - name: "$.param"
    pattern: '\$\.param\s*\('
    description: "jQuery param serialization"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".val() getter"
    pattern: '\.val\s*\(\s*\)'
    description: "jQuery value getter"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".data() getter"
    pattern: '\.data\s*\(\s*[''"][^)]+[''"]?\s*\)'
    description: "jQuery data attribute getter"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".attr() getter"
    pattern: '\.attr\s*\(\s*[''"][^)]+[''"]?\s*\)'
    description: "jQuery attribute getter"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".prop() getter"
    pattern: '\.prop\s*\(\s*[''"][^)]+[''"]?\s*\)'
    description: "jQuery property getter"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".text() getter"
    pattern: '\.text\s*\(\s*\)'
    description: "jQuery text getter"
    severity: "INFO"
    category: "jquery"
    exploitability: "LOW"

  - name: "$.ajax success"
    pattern: '\$\.ajax\s*\([^)]*success\s*:'
    description: "jQuery AJAX response handler"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: ".load() response"
    pattern: '\.load\s*\(\s*[''"][^)]+[''"]'
    description: "jQuery load response"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  - name: "$.get/$.post response"
    pattern: '\$\.(get|post|getJSON)\s*\('
    description: "jQuery AJAX shorthand"
    severity: "INFO"
    category: "jquery"
    exploitability: "MEDIUM"

  # ---------------------------------------------------------------------------
  # Fetch/XHR Sources
  # ---------------------------------------------------------------------------
  - name: "fetch response"
    pattern: 'fetch\s*\([^)]+\)\s*\.then'
    description: "Fetch API response"
    severity: "INFO"
    category: "network"
    exploitability: "MEDIUM"

  - name: "XMLHttpRequest.response"
    pattern: '\.response(?:Text|XML)?(?!\s*=)'
    description: "XHR response data"
    severity: "INFO"
    category: "network"
    exploitability: "MEDIUM"

  - name: "response.json()"
    pattern: '\.json\s*\(\s*\)'
    description: "JSON response parsing"
    severity: "INFO"
    category: "network"
    exploitability: "MEDIUM"

  - name: "response.text()"
    pattern: '\.text\s*\(\s*\)'
    description: "Text response"
    severity: "INFO"
    category: "network"
    exploitability: "MEDIUM"

  # ---------------------------------------------------------------------------
  # Custom/Common Getter Patterns
  # ---------------------------------------------------------------------------
  - name: "getParameter"
    pattern: 'getParameter\s*\('
    description: "Custom parameter getter function"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "getParam"
    pattern: 'getParam\s*\('
    description: "Custom param getter"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "getUrlParam"
    pattern: 'getUrlParam\s*\('
    description: "Custom URL param getter"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "getQueryString"
    pattern: 'getQueryString\s*\('
    description: "Custom query string getter"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "getHashParam"
    pattern: 'getHashParam\s*\('
    description: "Custom hash param getter"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "parseQueryString"
    pattern: 'parseQueryString\s*\('
    description: "Custom query parser"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "parseUrl"
    pattern: 'parseUrl\s*\('
    description: "Custom URL parser"
    severity: "INFO"
    category: "custom"
    exploitability: "HIGH"

  - name: "decodeURIComponent"
    pattern: 'decodeURIComponent\s*\('
    description: "URL decoding - indicates URL param processing"
    severity: "INFO"
    category: "encoding"
    exploitability: "MEDIUM"

  - name: "decodeURI"
    pattern: 'decodeURI\s*\('
    description: "URI decoding"
    severity: "INFO"
    category: "encoding"
    exploitability: "MEDIUM"

  - name: "unescape"
    pattern: 'unescape\s*\('
    description: "Legacy URL unescaping (deprecated)"
    severity: "INFO"
    category: "encoding"
    exploitability: "MEDIUM"

  - name: "atob"
    pattern: 'atob\s*\('
    description: "Base64 decoding"
    severity: "INFO"
    category: "encoding"
    exploitability: "LOW"

  - name: "JSON.parse"
    pattern: 'JSON\.parse\s*\('
    description: "JSON parsing - check what's being parsed"
    severity: "INFO"
    category: "encoding"
    exploitability: "LOW"

# ============================================================================
# SINKS - Dangerous functions that can execute code or inject content
# ============================================================================
sinks:

  # ---------------------------------------------------------------------------
  # JavaScript Execution Sinks (CRITICAL)
  # ---------------------------------------------------------------------------
  - name: "eval"
    pattern: '\beval\s*\('
    description: "eval() - executes string as JavaScript code"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Never use eval with user input. Use JSON.parse for JSON data."

  - name: "Function constructor"
    pattern: '\bFunction\s*\('
    description: "Function() constructor - creates function from string"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Avoid Function constructor with dynamic input."

  - name: "new Function"
    pattern: 'new\s+Function\s*\('
    description: "new Function() - alternative function constructor"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Avoid Function constructor with dynamic input."

  - name: "setTimeout string"
    pattern: 'setTimeout\s*\(\s*[''"`]'
    description: "setTimeout with string argument (implicit eval)"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Use function reference instead of string."

  - name: "setTimeout variable"
    pattern: 'setTimeout\s*\(\s*[a-zA-Z_$][a-zA-Z0-9_$]*\s*[,\)]'
    description: "setTimeout with variable (check if string)"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Ensure variable is a function, not string."

  - name: "setInterval string"
    pattern: 'setInterval\s*\(\s*[''"`]'
    description: "setInterval with string argument (implicit eval)"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"
    remediation: "Use function reference instead of string."

  - name: "setInterval variable"
    pattern: 'setInterval\s*\(\s*[a-zA-Z_$][a-zA-Z0-9_$]*\s*[,\)]'
    description: "setInterval with variable"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setImmediate string"
    pattern: 'setImmediate\s*\(\s*[''"`]'
    description: "setImmediate with string"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "execScript"
    pattern: 'execScript\s*\('
    description: "execScript (IE-specific, deprecated)"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "msSetImmediate"
    pattern: 'msSetImmediate\s*\('
    description: "msSetImmediate (IE-specific)"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  # ---------------------------------------------------------------------------
  # HTML Injection Sinks (HIGH)
  # ---------------------------------------------------------------------------
  - name: "innerHTML"
    pattern: '\.innerHTML\s*='
    description: "innerHTML assignment - parses and executes HTML/scripts"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"
    remediation: "Use textContent for text, or sanitize HTML with DOMPurify."

  - name: "innerHTML +="
    pattern: '\.innerHTML\s*\+='
    description: "innerHTML concatenation"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "outerHTML"
    pattern: '\.outerHTML\s*='
    description: "outerHTML assignment"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "insertAdjacentHTML"
    pattern: '\.insertAdjacentHTML\s*\('
    description: "insertAdjacentHTML - inserts HTML at specified position"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"
    remediation: "Use insertAdjacentText or sanitize input."

  - name: "insertAdjacentElement"
    pattern: '\.insertAdjacentElement\s*\('
    description: "insertAdjacentElement"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.write"
    pattern: 'document\.write\s*\('
    description: "document.write - writes to document stream"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"
    remediation: "Avoid document.write entirely."

  - name: "document.writeln"
    pattern: 'document\.writeln\s*\('
    description: "document.writeln - writes line to document"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.body.innerHTML"
    pattern: 'document\.body\.innerHTML\s*='
    description: "Body innerHTML assignment"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.head.innerHTML"
    pattern: 'document\.head\.innerHTML\s*='
    description: "Head innerHTML assignment"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  # ---------------------------------------------------------------------------
  # DOM Manipulation Sinks
  # ---------------------------------------------------------------------------
  - name: "createElement script"
    pattern: 'createElement\s*\(\s*[''"]script[''"]'
    description: "Creating script element"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "createElement iframe"
    pattern: 'createElement\s*\(\s*[''"]iframe[''"]'
    description: "Creating iframe element"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "createElement object"
    pattern: 'createElement\s*\(\s*[''"]object[''"]'
    description: "Creating object element"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "createElement embed"
    pattern: 'createElement\s*\(\s*[''"]embed[''"]'
    description: "Creating embed element"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "createContextualFragment"
    pattern: 'createContextualFragment\s*\('
    description: "Creating document fragment from HTML string"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "Range.createContextualFragment"
    pattern: '\.createContextualFragment\s*\('
    description: "Range createContextualFragment"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "DOMParser.parseFromString"
    pattern: 'DOMParser[^.]*\.parseFromString\s*\('
    description: "DOMParser parsing HTML"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom-manipulation"

  - name: "document.implementation.createHTMLDocument"
    pattern: 'createHTMLDocument\s*\('
    description: "Creating HTML document"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom-manipulation"

  # ---------------------------------------------------------------------------
  # Attribute Manipulation Sinks
  # ---------------------------------------------------------------------------
  - name: "setAttribute on*"
    pattern: 'setAttribute\s*\(\s*[''"]on[a-z]+'
    description: "Setting event handler attribute"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "attribute"
    remediation: "Use addEventListener instead of inline handlers."

  - name: "setAttribute src"
    pattern: 'setAttribute\s*\(\s*[''"]src[''"]'
    description: "Setting src attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attribute"

  - name: "setAttribute href"
    pattern: 'setAttribute\s*\(\s*[''"]href[''"]'
    description: "Setting href attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attribute"

  - name: "setAttribute action"
    pattern: 'setAttribute\s*\(\s*[''"]action[''"]'
    description: "Setting form action"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attribute"

  - name: "setAttribute formaction"
    pattern: 'setAttribute\s*\(\s*[''"]formaction[''"]'
    description: "Setting formaction attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "attribute"

  - name: "setAttribute data"
    pattern: 'setAttribute\s*\(\s*[''"]data[''"]'
