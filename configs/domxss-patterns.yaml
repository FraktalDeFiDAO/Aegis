# ============================================================================
# FRAMEWORK DETECTION
# ============================================================================
frameworks:
  - name: "jQuery"
    pattern: 'jquery|\.fn\.|jQuery|\$\s*\('
    version_pattern: 'jquery[/-]?v?(\d+\.\d+(?:\.\d+)?)'
    vulnerable_versions:
      - version: "< 1.9.0"
        issue: "Selector-based XSS via $() with HTML"
      - version: "< 3.5.0"
        issue: "Prototype pollution in $.extend"

  - name: "React"
    pattern: 'React\.|ReactDOM|createElement|useState|useEffect'
    version_pattern: 'react[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Vue"
    pattern: 'Vue\.|new Vue|createApp|v-bind|v-model|v-html'
    version_pattern: 'vue[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Angular"
    pattern: '@angular|platformBrowser|ngModule|Component'
    version_pattern: '@angular/core[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "AngularJS"
    pattern: 'angular\.module|ng-app|ng-controller|ng-repeat'
    version_pattern: 'angular[/-]?v?(\d+\.\d+(?:\.\d+)?)'
    vulnerable_versions:
      - version: "< 1.6.0"
        issue: "Sandbox bypass vulnerabilities"

  - name: "Svelte"
    pattern: '<script.*context="module"|{@html|bind:'
    version_pattern: 'svelte[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Ember"
    pattern: 'Ember\.|{{#each|{{#if|@ember'
    version_pattern: 'ember[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Backbone"
    pattern: 'Backbone\.|Marionette|\.extend\('
    version_pattern: 'backbone[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Knockout"
    pattern: 'ko\.|data-bind'
    version_pattern: 'knockout[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Handlebars"
    pattern: 'Handlebars\.|{{#|{{/|{{>'
    version_pattern: 'handlebars[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Mustache"
    pattern: 'Mustache\.|{{#|{{/|{{>'
    version_pattern: 'mustache[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Lodash"
    pattern: '_\.|lodash'
    version_pattern: 'lodash[/-]?v?(\d+\.\d+(?:\.\d+)?)'
    vulnerable_versions:
      - version: "< 4.17.21"
        issue: "Prototype pollution"

  - name: "Underscore"
    pattern: '_\.|underscore'
    version_pattern: 'underscore[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "DOMPurify"
    pattern: 'DOMPurify'
    version_pattern: 'dompurify[/-]?v?(\d+\.\d+(?:\.\d+)?)'
    is_sanitizer: true

  - name: "Next.js"
    pattern: 'next/|__NEXT_DATA__'
    version_pattern: 'next[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Nuxt"
    pattern: 'nuxt|__NUXT__'
    version_pattern: 'nuxt[/-]?v?(\d+\.\d+(?:\.\d+)?)'

  - name: "Gatsby"
    pattern: 'gatsby'
    version_pattern: 'gatsby[/-]?v?(\d+\.\d+(?:\.\d+)?)'

